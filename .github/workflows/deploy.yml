name: Deploy to Cloudflare (manual, free-tier only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      MEMORY_API_TOKEN: ${{ secrets.MEMORY_API_TOKEN }}
      MEMORY_AGENT_TOKEN: ${{ secrets.MEMORY_AGENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Cloudflare token not configured"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Cloudflare account ID not configured"; exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Cloudflare D1 database ID not configured"; exit 1)
          test "${#MEMORY_API_TOKEN}" -ge 32 || (echo "Missing strong MEMORY_API_TOKEN"; exit 1)
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build temporary deployment config
        run: |
          node -e "const fs=require('fs');const path='wrangler.jsonc';const s=fs.readFileSync(path,'utf8');fs.writeFileSync(path,s.replace('REPLACE_WITH_YOUR_D1_DATABASE_ID',process.env.CLOUDFLARE_D1_DATABASE_ID));"
      - name: Apply migrations to D1
        run: npx wrangler d1 migrations apply memory-hub --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure owner authentication
        run: printf '%s' "$MEMORY_API_TOKEN" | npx wrangler secret put MEMORY_API_TOKEN
      - name: Configure agent token if supplied
        if: env.MEMORY_AGENT_TOKEN != ''
        run: printf '%s' "$MEMORY_AGENT_TOKEN" | npx wrangler secret put MEMORY_AGENT_TOKEN
      - name: Done
        run: echo "Deployed using pre-authorized Cloudflare account. Check Cloudflare dashboard for the workers.dev URL and usage."
